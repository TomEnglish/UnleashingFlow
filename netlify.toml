[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.11.0"
  NPM_VERSION = "10"

[[redirects]]
  from = "/the-current/*"
  to = "/"
  status = 301
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
